<body>

<div class="grid-container">
    <div class="pigeon_1"><figure>
    <img id="large" src="pigeon_1.jpg" alt="a young pigeon with dark colors" onclick = "change('pigeon_1.jpg','This is a young pigeon with dark colors')">
    <figcaption id="caption">This is a young pigeon with dark colors</figcaption>
    </figure>
    </div>

    </figure>
    <div class="pigeon_2.">
    <figure>

    <figcaption id="caption">A pigeon simply looking away from the camera</figcaption>
    </figure>
    </div>

    
    <div class="pigeon_3.">

    <img id="large" src="pigeon_3.jpg" alt="a photo of a pigeon with eye closed" onclick = "change('pigeon_3.jpg','This pigeon is closing its eyes')">

    </figure>
    </div>

    <div class="pigeon_4">

    </figure>
    </div>

    <div class="pigeon_5"><figure>
    <img id="large" src="pigeon_5.jpg" alt="a pigeon looking at the camera" onclick="change('pigeon_5.jpg','A pigeon looking at the camera')">

    </figure>
    </div>
    <div class="bird">

    <figcaption id="caption">This is a young pigeon with dark colors</figcaption>
    </figure>
    </div>
</div>
    <button onclick="setBgColor('white')">white</button>
    <button onclick="setBgColor('yellow')">yellow</button>
